name: Publish package

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@marvey11"
      - run: npm ci
      - run: npm run build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - name: Set package visibility to public
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: gh api --method PATCH "/user/packages/npm/%40marvey11%2Fcodescape-react-utils" --field visibility=public
