name: Publish package

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@marvey11"
      - run: npm ci
      - run: npm run build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - name: Explain package visibility setup
        run: |
          {
            echo "### GitHub Packages visibility"
            echo "GitHub's npm registry does not provide a REST endpoint to change package visibility. After the first publish, open the package settings and change visibility to Public."
            echo "See the Release section in README.md for the steps."
          } >> "$GITHUB_STEP_SUMMARY"
